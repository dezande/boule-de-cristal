name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Tests de la logique des zones
        run: node --test "tests/**/*.test.mjs"

      - name: Vérification du manifest et du cache hors-ligne
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            for (const icon of manifest.icons) {
              if (!fs.existsSync(icon.src)) throw new Error("Icône manquante : " + icon.src);
            }
            const sw = fs.readFileSync("sw.js", "utf8");
            const assets = [...sw.matchAll(/\x27\.\/([^\x27]+)\x27/g)].map((m) => m[1]);
            for (const file of assets) {
              if (!fs.existsSync(file)) throw new Error("Fichier absent du dépôt mais mis en cache : " + file);
            }
            console.log("manifest OK, " + assets.length + " fichiers mis en cache présents");
          '
